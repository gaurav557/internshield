databases:
  - name: internshield-db
    databaseName: internshield
    user: internshield
    plan: free

services:
  - type: web
    name: internshield
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: internshield-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@internshield.local
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: NODE_VERSION
        value: 20.18.0
